name: Pester Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pester:
    runs-on: ubuntu-latest
    # Least privilege, stated rather than inherited — every sibling workflow in
    # this repository declares it, and naming any scope sets every unnamed one
    # to `none`. This job runs every selected suite from the pull request head
    # across ten concurrent processes; none of them needs a token.
    permissions:
      contents: read
    # A BOUND, not a formality (issue #1037). Before this, no job in this
    # repository bounded itself, so a suite that never returned held the gate
    # to GitHub's own 360-minute ceiling on every pull request until a human
    # noticed — and the first signal is a job that looks like it is running
    # normally. This chunk is what makes that live: it fans the gate out and
    # promotes the corpus's most plausible non-returning worker, and #1036
    # then promotes ~188 suites that have never executed on Linux.
    #
    # THE ARITHMETIC, FROM THIS GATE'S OWN RUNS — not from a model.
    # An earlier revision of this comment sized the bound from run 31361629558,
    # which measured one suite at a time per runner. That is precisely the
    # measurement the audit's own parity note says does not predict this gate's
    # wall clock, and using it understated the job by ~2.5x. Replaced with what
    # the gate actually did:
    #
    #   run 31415554651 (65 suites, fan-out 10): job 332s, runner wall 306.5s,
    #   and the run's own per-suite wall clocks sum to 2058.7s — 6.1x the 337s
    #   the old estimate was built on, which is the contention factor made
    #   visible.
    #
    # Moving `ci-glob-audit-core.Tests.ps1` onto the sequential shard was
    # projected to lengthen the tail to ~470s. MEASURED INSTEAD, on the first
    # green run of this configuration:
    #
    #   run 31424436634 (65 suites, fan-out 10, the two isolation-required
    #   suites sequential): job 273s (19:30:42Z → 19:35:15Z), green.
    #
    # Faster than both the projection and the 332s contended run, because the
    # suites that were starving each other no longer share a machine. The
    # projection is recorded as having been wrong in the safe direction rather
    # than quietly replaced — a bound justified by an estimate its own next run
    # falsifies is the defect this comment was rewritten to fix.
    #
    # 25 minutes is therefore **5.5x the measured job**, with headroom for the
    # ~188 suites #1036 promotes into it, and still 14x BELOW the platform
    # ceiling this exists to stop us reaching. Re-derive it from the gate's own
    # runs when #1036 lands; do not re-derive it from the audit's distribution.
    timeout-minutes: 25
    steps:
      # Pinned by commit, matching ci-full-glob-audit.yml. A mutable tag on the
      # job that executes every selected suite from the pull request head is
      # the one place in this repository where tag mutation would matter most.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Pester
        shell: pwsh
        run: |
          # This suite is validated against Pester 6.0.0. The window below
          # (`-MinimumVersion 6.0.0 -MaximumVersion 6.999.999`) holds CI on
          # that major while floating patches/minors within it, so routine
          # releases never require a workflow edit. `-Force -MinimumVersion`
          # alone pulls the newest available major, which is a breaking-change
          # risk (Pester 6 itself broke unmatched-Mock fall-through behavior
          # relative to 5.x); the `-MaximumVersion` ceiling prevents CI from
          # silently jumping majors again. Both the floor and the ceiling are
          # bumped together, deliberately, on the next major migration — issue
          # #818 is the precedent for how that migration is done.
          Install-Module -Name Pester -Force -SkipPublisherCheck -MinimumVersion 6.0.0 -MaximumVersion 6.999.999
          Import-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.999.999
          Install-Module -Name powershell-yaml -Force -SkipPublisherCheck
      - name: Run Pester tests (glob minus explicit quarantine, sharded)
        shell: pwsh
        run: |
          # SELECTION IS A GLOB MINUS A QUARANTINE, not an allowlist.
          #
          # This step used to carry a hand-maintained list of ~52 test files.
          # An allowlist makes exclusion the DEFAULT and makes it SILENT: a new
          # suite is unprotected the moment it is written and nothing notices.
          # Measured when this changed: 52 files listed, 191 not — 4,136 of
          # 5,475 test blocks never ran here, including suites written that
          # same week.
          #
          # The list was not really an allowlist either. Most of its exclusions
          # were quarantines ("20 pre-existing Linux-CI failures ... tracked in
          # issue #904") written in a form that could not distinguish
          # "temporarily broken" from "never registered".
          #
          # So: run everything, and require an explicit, classified, reasoned
          # entry in .github/scripts/Tests/ci-quarantine.json to skip a file.
          # ci-suite-registration.Tests.ps1 fails this job if any suite on disk
          # is neither run nor listed there, and that guard is itself selected
          # by the glob, so it cannot be dropped without dropping its reporter.
          #
          # The migration was conservative on purpose: exactly the files this
          # job already ran still run. What changed is what happens to the next
          # file someone adds.
          #
          # SHARDED, AND DRIVEN BY THE SELECTION (issue #1037). The selection
          # below is handed to the repository's own sharded runner as an
          # explicit list. The runner does NOT glob: its own default would
          # discover every suite on disk, quarantine included, which is the one
          # thing this selection exists to prevent.
          . .github/scripts/lib/ci-suite-selection-core.ps1
          . .github/scripts/lib/pester-sharded-core.ps1
          $selection = Get-CISuiteSelection `
            -TestsRoot '.github/scripts/Tests' `
            -QuarantinePath '.github/scripts/Tests/ci-quarantine.json'
          if ($selection.HasDrift) {
            # Reported before the run, not only through the guard suite: a
            # malformed registry must not be diagnosed by a job that failed to
            # start for some other reason.
            Write-Host "::error::CI suite selection drift:"
            $selection.DriftDetails | ForEach-Object { Write-Host "::error::  $_" }
            exit 1
          }

          # ---- What this green does NOT cover, where the check is read -----
          #
          # Every figure here is derived from the selection this run just made,
          # never typed into this file: change the quarantine and these numbers
          # change with it, with no edit here. A count written down in a
          # workflow reads as a disclosure and is false the next time anyone
          # touches the registry.
          #
          # `::notice::` is a workflow-command ANNOTATION: it renders on the
          # pull request's checks surface, so a maintainer sees it without
          # opening this step's log. The job summary below carries the excluded
          # set itself with each entry's class — one hop from the same place.
          # Counted over DISTINCT FILE NAMES, not over registry entries. The
          # registry has no duplicate-entry check, so summing entry rows made
          # one honest copy-paste inflate the denominator and list a suite
          # twice — a false coverage disclosure that reads as authoritative
          # precisely because it is computed.
          $excludedNames = @($selection.Quarantined | ForEach-Object { [string]$_.file } | Sort-Object -Unique)
          $duplicateEntries = @($selection.Quarantined | Group-Object -Property file |
            Where-Object { $_.Count -gt 1 } | ForEach-Object { $_.Name })
          $byClass = $selection.Quarantined | Sort-Object file -Unique | Group-Object -Property class |
            Sort-Object Name | ForEach-Object { "$($_.Name) $($_.Count)" }
          $onDisk = $selection.Selected.Count + $excludedNames.Count
          # Sanitised for the annotation channel: a newline in registry text
          # would start a line at column 0, which the runner parses as a second
          # workflow command.
          $classSummary = (($byClass -join ', ') -replace '[\r\n]+', ' ')
          Write-Host ("::notice title=What this check covers::{0} of {1} suites on disk were selected to run; {2} are excluded by the quarantine registry ({3}). The excluded list, with each entry's class and stated reason, is in this run's job summary." -f `
            $selection.Selected.Count, $onDisk, $excludedNames.Count, $classSummary)
          if ($duplicateEntries.Count -gt 0) {
            Write-Host ("::warning title=Quarantine registry::{0} suite(s) carry more than one quarantine entry: {1}. The counts above are over distinct file names; the duplicate entries should be merged." -f `
              $duplicateEntries.Count, (($duplicateEntries -join ', ') -replace '[\r\n]+', ' '))
          }

          if ($env:GITHUB_STEP_SUMMARY) {
            # EVERY interpolated registry value goes through this. The registry
            # is a file a pull request can edit, so its text is untrusted here:
            # a newline terminates the table and lets arbitrary Markdown follow,
            # a backtick ends a code span, and escaping only the pipe is
            # defeated by a backslash immediately before one. Order matters —
            # the backslash must be escaped first or it re-escapes the escapes.
            function Format-RegistryCell {
              param([object]$Value)
              $text = [string]$Value
              if ([string]::IsNullOrEmpty($text)) { return '' }
              $text = $text -replace '\\', '\\'
              $text = $text -replace '\|', '\|'
              $text = $text -replace '`', '\`'
              $text = $text -replace '<', '&lt;' -replace '>', '&gt;'
              # Newlines become a visible marker rather than a table break.
              return ($text -replace '\r?\n', ' ⏎ ')
            }

            $md = [System.Collections.Generic.List[string]]::new()
            $md.Add('## Pester gate — what this check covers')
            $md.Add('')
            $md.Add("**$($selection.Selected.Count) of $onDisk** suites on disk were selected to run. **$($excludedNames.Count)** were excluded by ``.github/scripts/Tests/ci-quarantine.json`` ($($byClass -join ', ')).")
            $md.Add('')
            $md.Add('A suite is excluded only by an explicit, classified, reasoned entry in that registry, and every legal class is a DECISION about a suite that was actually measured — issue #1036 retired `unclassified`, which meant "nobody looked", so `Get-CISuiteSelection` now refuses an entry carrying it. `linux-red` says where a failure was observed, not that its cause is platform-specific; `never-ci` is for an obstacle nothing here can remove, never one the gate chooses; `no-signal` is a suite that executes and yields no verdict. The last two of those three require an issue.')
            $md.Add('')
            $md.Add('<details><summary>The ' + $excludedNames.Count + ' suites this check does not cover</summary>')
            $md.Add('')
            $md.Add('| suite | class | issue | reason |')
            $md.Add('| --- | --- | --- | --- |')
            foreach ($q in ($selection.Quarantined | Sort-Object class, file)) {
              $issue = if ($q.PSObject.Properties.Match('issue').Count -gt 0 -and $q.issue) { '#' + (Format-RegistryCell $q.issue) } else { '' }
              $md.Add("| ``$(Format-RegistryCell $q.file)`` | $(Format-RegistryCell $q.class) | $issue | $(Format-RegistryCell $q.reason) |")
            }
            $md.Add('')
            $md.Add('</details>')
            $md -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          # ---- Run --------------------------------------------------------
          #
          # FanOutWidth is DERIVED, not chosen: Get-PesterFanOutWidth over the
          # full-glob duration distribution measured by #1035's audit run
          # 31361629558 at commit 0f3c824 returns 10 —
          #   ceil(parallel total 1,171,050 ms / longest parallel suite 118,518 ms)
          # past which another worker cannot shorten the run, because that one
          # suite is on the critical path whatever else is running. Derived over
          # the FULL GLOB deliberately: that is the load the gate carries after
          # #1036, not the subset it gates today. The derivation and its inputs
          # are pinned by an assertion in run-pester-sharded.Tests.ps1.
          #
          # Verbosity is Normal rather than Detailed: with 10 workers writing to
          # one console, per-test Detailed output interleaves into something no
          # one can read. Normal still prints every failing test, and the
          # runner's own per-suite table and FAILED SUITES block name the suite.
          #
          # MinTestCount is passed EXPLICITLY, with its arithmetic, rather than
          # inherited from the library default. The floor exists so a run that
          # silently stopped discovering tests cannot report green; leaving it
          # implicit meant the gate depended on a number recorded nowhere. Run
          # 31415554651 executed 2150 tests over this selection, so 200 is a
          # 10.75x margin — comfortably satisfiable, and low enough that losing
          # most of the corpus would still trip it.
          $result = Invoke-PesterSharded `
            -SuitePath $selection.Selected `
            -FanOutWidth 10 `
            -MinTestCount 200 `
            -Output 'Normal'
          if ($result.ExitCode -ne 0) {
            # Say which channel reddened. `SuitesNotPassed` counts per-suite
            # outcome rows ONLY, so a run reddened purely by reconciliation or
            # by the minimum-count floor has zero of them — and the annotation
            # used to read "0 of N selected suite(s) did not pass", on the exact
            # surface this check's disclosure exists to make honest.
            $why = @()
            if ($result.SuitesNotPassed -gt 0) {
              $why += "$($result.SuitesNotPassed) of $($result.SuitesSelected) selected suite(s) did not pass"
            }
            if (-not $result.Reconciliation.Ok) {
              $why += ("the run did not account for its selection exactly once (missing {0}, unexpected {1}, duplicate {2})" -f `
                @($result.Reconciliation.Missing).Count, @($result.Reconciliation.Unexpected).Count, @($result.Reconciliation.Duplicate).Count)
            }
            if ($result.SuitesNotPassed -eq 0 -and $result.Reconciliation.Ok) {
              $why += "the run executed $($result.TestsExecuted) test(s), below the minimum this gate requires"
            }
            Write-Host "::error title=Pester gate::$($why -join '; '). See the run summary above."
            exit 1
          }
