name: Pester Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: |
          # This suite is validated against Pester 6.0.0. The window below
          # (`-MinimumVersion 6.0.0 -MaximumVersion 6.999.999`) holds CI on
          # that major while floating patches/minors within it, so routine
          # releases never require a workflow edit. `-Force -MinimumVersion`
          # alone pulls the newest available major, which is a breaking-change
          # risk (Pester 6 itself broke unmatched-Mock fall-through behavior
          # relative to 5.x); the `-MaximumVersion` ceiling prevents CI from
          # silently jumping majors again. Both the floor and the ceiling are
          # bumped together, deliberately, on the next major migration — issue
          # #818 is the precedent for how that migration is done.
          Install-Module -Name Pester -Force -SkipPublisherCheck -MinimumVersion 6.0.0 -MaximumVersion 6.999.999
          Import-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.999.999
          Install-Module -Name powershell-yaml -Force -SkipPublisherCheck
      - name: Run Pester tests (glob minus explicit quarantine)
        shell: pwsh
        run: |
          # SELECTION IS A GLOB MINUS A QUARANTINE, not an allowlist.
          #
          # This step used to carry a hand-maintained list of ~52 test files.
          # An allowlist makes exclusion the DEFAULT and makes it SILENT: a new
          # suite is unprotected the moment it is written and nothing notices.
          # Measured when this changed: 52 files listed, 191 not — 4,136 of
          # 5,475 test blocks never ran here, including suites written that
          # same week.
          #
          # The list was not really an allowlist either. Most of its exclusions
          # were quarantines ("20 pre-existing Linux-CI failures ... tracked in
          # issue #904") written in a form that could not distinguish
          # "temporarily broken" from "never registered".
          #
          # So: run everything, and require an explicit, classified, reasoned
          # entry in .github/scripts/Tests/ci-quarantine.json to skip a file.
          # ci-suite-registration.Tests.ps1 fails this job if any suite on disk
          # is neither run nor listed there, and that guard is itself selected
          # by the glob, so it cannot be dropped without dropping its reporter.
          #
          # The migration was conservative on purpose: exactly the files this
          # job already ran still run. What changed is what happens to the next
          # file someone adds.
          . .github/scripts/lib/ci-suite-selection-core.ps1
          $selection = Get-CISuiteSelection `
            -TestsRoot '.github/scripts/Tests' `
            -QuarantinePath '.github/scripts/Tests/ci-quarantine.json'
          if ($selection.HasDrift) {
            # Reported before the run, not only through the guard suite: a
            # malformed registry must not be diagnosed by a job that failed to
            # start for some other reason.
            Write-Host "::error::CI suite selection drift:"
            $selection.DriftDetails | ForEach-Object { Write-Host "::error::  $_" }
            exit 1
          }
          Write-Host "Selected $($selection.Selected.Count) suite(s); quarantined $($selection.Quarantined.Count) (unclassified backlog: $($selection.UnclassifiedCount))."
          $config = New-PesterConfiguration
          $config.Run.Path = $selection.Selected
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
