# Measures the WHOLE Pester corpus on Linux, on demand.
#
# The per-PR gate (pester.yml) runs a glob MINUS a quarantine: 61 of 252 suites
# today. The other 191 — 189 of them class `unclassified`, meaning nobody ever
# decided to exclude them — have never executed on this platform. This workflow
# runs all of them, deliberately ignoring the quarantine, so #1036 can triage
# with a failure message in hand and #1037 can size shards from a measured
# duration distribution.
#
# IT GATES NOTHING. It is dispatch-only, it never touches pester.yml's
# selection, and it is RED BY CONSTRUCTION: ignoring the quarantine means it
# fails whenever any suite fails, which is the expected state from day one.
# Do not add a step that makes it green, and do not make it a required check.
#
# There is deliberately no `schedule:` trigger. The recurring standing audit is
# issue #1047's, together with the promotable/regression detection that gives a
# nightly run something to detect. Issue #1035 is the instrument.
name: CI full-glob audit

on:
  workflow_dispatch:
    inputs:
      record_issue:
        description: 'Issue number the record and observation history are persisted on'
        required: true
        default: '1035'
      timeout_seconds:
        description: 'Per-suite bound in seconds. A suite that has not returned by then is killed and recorded did-not-complete.'
        required: true
        default: '300'
      shard_count:
        description: 'How many parallel jobs to fan out across. Each job runs its suites one at a time, so measured durations stay non-contended.'
        required: true
        default: '8'

permissions:
  contents: read

concurrency:
  # Never two audits at once: they would interleave writes to the same record
  # comments and the observation history, and the history's whole job is to say
  # how many comparable observations a suite has.
  group: ci-full-glob-audit
  cancel-in-progress: false

jobs:
  prepare:
    name: Derive the population
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.derive.outputs.shards }}
      population_count: ${{ steps.derive.outputs.population_count }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Derive the population once, from the gate's own selection procedure
        id: derive
        shell: pwsh
        run: |
          # Derived ONCE and handed to every job. Re-deriving per job would work
          # today and drift the first time two jobs saw different trees; more
          # importantly, the one-to-one check downstream has to compare the
          # record against a population somebody can point at.
          ./.github/scripts/ci-glob-audit.ps1 -Mode Prepare `
            -ShardCount ${{ inputs.shard_count }} `
            -OutFile ci-glob-audit-population.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ci-glob-audit-population
          path: ci-glob-audit-population.json
          retention-days: 7

  measure:
    name: Measure shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    # Under the 360-minute platform ceiling with room to spare. With 8 shards
    # and a 300s bound, a shard whose every suite hangs costs about 160 minutes.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    permissions:
      contents: read
    steps:
      # Checked out exactly the way pester.yml checks out — no fetch-depth, no
      # persist-credentials override — because any avoidable divergence from the
      # gate's environment makes every outcome here garbage. The compose job,
      # which executes no suites, checks out differently on purpose.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Pester and powershell-yaml exactly as the gate does
        shell: pwsh
        run: |
          # Same window, same unpinned yaml module. Omitting either would be a
          # divergence the audit could have matched and did not, which reddens
          # suites for a manufactured reason.
          Install-Module -Name Pester -Force -SkipPublisherCheck -MinimumVersion 6.0.0 -MaximumVersion 6.999.999
          Import-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.999.999
          Install-Module -Name powershell-yaml -Force -SkipPublisherCheck

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: ci-glob-audit-population

      - name: Attempt this shard's suites, one process at a time
        shell: pwsh
        run: |
          # No GH_TOKEN here, deliberately: pester.yml declares no permissions
          # block, no env block and no token, so a suite that shells out to `gh`
          # must meet the same nothing under the audit that it meets in the gate.
          ./.github/scripts/ci-glob-audit.ps1 -Mode Shard `
            -PopulationFile ci-glob-audit-population.json `
            -ShardIndex ${{ matrix.shard }} `
            -TimeoutSeconds ${{ inputs.timeout_seconds }} `
            -WorkDir "$env:RUNNER_TEMP/ci-glob-audit" `
            -OutFile "ci-glob-audit-partial-${{ matrix.shard }}.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: ci-glob-audit-partial-${{ matrix.shard }}
          path: ci-glob-audit-partial-${{ matrix.shard }}.json
          retention-days: 30

      - name: Upload captured console output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          # A convenience only. Artifacts expire, so no property of the record
          # rests on this: the classifying detail lives in the durable comments.
          name: ci-glob-audit-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-glob-audit/*.log
          retention-days: 14
          if-no-files-found: ignore

  compose:
    name: Compose and persist the record
    needs: [prepare, measure]
    # always(), because a shard that hit its own job timeout must still produce
    # a record — one that says loudly which shard is missing. A record that is
    # simply absent teaches nobody anything.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The record's durable home is an issue comment. Step-scoped token, as
      # render-portfolio.yml already does — the suite-executing jobs above never
      # see it.
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Full history here and only here: the record's commit anchor is
          # settled by ANCESTRY against the default branch tip plus a per-suite
          # content comparison, and neither is computable in a depth-1 clone.
          # This job executes no suites, so it is not part of the parity claim.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: ci-glob-audit-population

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: ci-glob-audit-partial-*
          path: partials
          merge-multiple: true

      - name: Compose, check and persist
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/scripts/ci-glob-audit.ps1 -Mode Compose `
            -PopulationFile ci-glob-audit-population.json `
            -PartialsDir partials `
            -Issue ${{ inputs.record_issue }}
